<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank QR · SBI & Federal</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      transition: background-color 0.3s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f4f8;
      padding: 1.5rem;
    }

    /* ----- LIGHT MODE (default) ----- */
    :root {
      --bg-body: #f2f4f8;
      --bg-card: #ffffff;
      --bg-option: #f0f3f7;
      --bg-option-hover: #e2e8f0;
      --bg-option-active: #d1d9e6;
      --text-primary: #1e293b;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --border-light: #e9edf2;
      --shadow-card: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
      --shadow-btn: 0 4px 8px rgba(0, 0, 0, 0.03);
      --qr-border: #dce1e8;
      --bank-sbi: #2a6f97;
      --bank-federal: #1a4c7a;
      --toggle-bg: #d1d9e6;
      --toggle-circle: #ffffff;
      --icon-color: #1e293b;
    }

    /* ----- DARK MODE ----- */
    body.dark {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --bg-option: #2d3a4f;
      --bg-option-hover: #3b4a63;
      --bg-option-active: #4b5d7a;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border-light: #334155;
      --shadow-card: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
      --shadow-btn: 0 4px 8px rgba(0, 0, 0, 0.3);
      --qr-border: #475569;
      --bank-sbi: #6ba3c7;
      --bank-federal: #5b8db8;
      --toggle-bg: #475569;
      --toggle-circle: #e2e8f0;
      --icon-color: #f1f5f9;
    }

    .container {
      width: 100%;
      max-width: 580px;
      background: var(--bg-card);
      border-radius: 2.5rem;
      padding: 2.2rem 2rem 2.8rem;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
      backdrop-filter: blur(2px);
      transition: all 0.3s ease;
    }

    /* header: title + dark mode toggle */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(145deg, var(--bank-sbi), var(--bank-federal));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .header h1 i {
      font-size: 1.6rem;
      color: var(--bank-sbi);
      background: transparent;
      -webkit-background-clip: unset;
      background-clip: unset;
    }

    .toggle-wrapper {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .toggle-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .toggle-switch {
      width: 50px;
      height: 26px;
      background: var(--toggle-bg);
      border-radius: 40px;
      cursor: pointer;
      position: relative;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
      transition: background 0.25s;
      flex-shrink: 0;
    }

    .toggle-switch .circle {
      width: 22px;
      height: 22px;
      background: var(--toggle-circle);
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.25s ease, background 0.2s;
    }

    body.dark .toggle-switch .circle {
      transform: translateX(24px);
    }

    .toggle-switch i {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      color: #2d3a4f;
      opacity: 0.6;
      pointer-events: none;
    }

    .toggle-switch .fa-moon {
      left: 6px;
    }
    .toggle-switch .fa-sun {
      right: 6px;
    }
    body.dark .toggle-switch .fa-moon { opacity: 0.2; }
    body.dark .toggle-switch .fa-sun { opacity: 1; color: #fbbf24; }

    /* option selectors */
    .option-group {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .option-btn {
      flex: 1;
      min-width: 110px;
      padding: 0.9rem 0.6rem;
      border-radius: 2rem;
      border: 2px solid transparent;
      background: var(--bg-option);
      color: var(--text-secondary);
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
    }

    .option-btn i {
      font-size: 1.2rem;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .option-btn:hover {
      background: var(--bg-option-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px -6px rgba(0, 0, 0, 0.08);
    }

    .option-btn.active {
      background: var(--bg-option-active);
      border-color: var(--bank-sbi);
      color: var(--text-primary);
      box-shadow: 0 6px 14px -6px rgba(42, 111, 151, 0.2);
    }

    .option-btn.active i {
      color: var(--bank-sbi);
    }

    .option-btn.federal-active.active {
      border-color: var(--bank-federal);
    }

    .option-btn.federal-active.active i {
      color: var(--bank-federal);
    }

    /* QR display */
    .qr-display {
      background: var(--bg-body);
      border-radius: 2.2rem;
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid var(--border-light);
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.02);
    }

    .qr-image-wrapper {
      background: white;
      padding: 1.2rem;
      border-radius: 2rem;
      box-shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--qr-border);
      line-height: 0;
      transition: border 0.2s;
      width: fit-content;
    }

    #qrImage {
      width: 200px;
      height: 200px;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
      background: white;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .bank-label {
      margin-top: 1.5rem;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .bank-label i {
      font-size: 1.5rem;
    }

    .bank-label .sbi-text { color: var(--bank-sbi); }
    .bank-label .federal-text { color: var(--bank-federal); }

    .qr-hint {
      margin-top: 0.6rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      background: var(--bg-option);
      padding: 0.25rem 1.2rem;
      border-radius: 30px;
    }

    /* responsive */
    @media (max-width: 480px) {
      .container { padding: 1.6rem 1.2rem; }
      .header h1 { font-size: 1.4rem; }
      .option-btn { font-size: 0.95rem; padding: 0.7rem 0.4rem; min-width: 90px; }
      #qrImage { width: 160px; height: 160px; }
    }
  </style>
</head>
<body>

<div class="container" id="appContainer">
  <!-- header -->
  <div class="header">
    <h1><i class="fas fa-qrcode"></i> PayQR</h1>
    <div class="toggle-wrapper">
      <span class="toggle-label"><i class="fas fa-circle-half-stroke"></i></span>
      <div class="toggle-switch" id="themeToggle" role="button" tabindex="0" aria-label="Toggle dark/light mode">
        <span class="circle"></span>
        <i class="fas fa-moon"></i>
        <i class="fas fa-sun"></i>
      </div>
    </div>
  </div>

  <!-- options -->
  <div class="option-group">
    <button class="option-btn sbi-active active" id="sbiBtn" data-bank="sbi">
      <i class="fas fa-building-columns"></i> SBI
    </button>
    <button class="option-btn federal-active" id="federalBtn" data-bank="federal">
      <i class="fas fa-landmark"></i> Federal
    </button>
  </div>

  <!-- QR display -->
  <div class="qr-display">
    <div class="qr-image-wrapper">
      <img id="qrImage" src="https://pub-a99082f3b6674c94a58faa3697bc0276.r2.dev/SBI.jpeg" alt="QR Code">
    </div>
    <div class="bank-label">
      <i class="fas fa-building-columns" id="bankIcon"></i>
      <span id="bankName">State Bank of India</span>
    </div>
    <div class="qr-hint">
      <i class="fas fa-camera"></i> Scan to pay with any UPI app
    </div>
  </div>
</div>

<script>
  (function() {
    // DOM refs
    const container = document.getElementById('appContainer');
    const themeToggle = document.getElementById('themeToggle');
    const qrImage = document.getElementById('qrImage');
    const bankName = document.getElementById('bankName');
    const bankIcon = document.getElementById('bankIcon');

    const sbiBtn = document.getElementById('sbiBtn');
    const federalBtn = document.getElementById('federalBtn');

    // --- QR DATA with your image URLs ---
    const QR_DATA = {
      sbi: {
        url: 'https://pub-a99082f3b6674c94a58faa3697bc0276.r2.dev/SBI.jpeg',
        label: 'State Bank of India',
        icon: 'fa-building-columns',
        iconColor: 'sbi-text'
      },
      federal: {
        url: 'https://pub-a99082f3b6674c94a58faa3697bc0276.r2.dev/Federl.jpeg',
        label: 'Federal Bank',
        icon: 'fa-landmark',
        iconColor: 'federal-text'
      }
    };

    let currentBank = 'sbi'; // sbi | federal

    // --- update UI with bank ---
    function setBank(bankKey) {
      const data = QR_DATA[bankKey];
      if (!data) return;

      // update image
      qrImage.src = data.url;
      // update label & icon
      bankName.textContent = data.label;
      // remove previous icon classes and add new
      bankIcon.className = `fas ${data.icon}`;
      // update label color class
      bankName.className = ''; // reset
      if (bankKey === 'sbi') {
        bankName.classList.add('sbi-text');
      } else {
        bankName.classList.add('federal-text');
      }

      // update active state on buttons
      sbiBtn.classList.toggle('active', bankKey === 'sbi');
      federalBtn.classList.toggle('active', bankKey === 'federal');

      // store current
      currentBank = bankKey;
    }

    // --- Theme toggle ---
    function toggleTheme() {
      document.body.classList.toggle('dark');
    }

    // --- event listeners ---
    sbiBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (currentBank === 'sbi') return;
      setBank('sbi');
    });

    federalBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (currentBank === 'federal') return;
      setBank('federal');
    });

    themeToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleTheme();
    });

    // keyboard support for toggle
    themeToggle.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleTheme();
      }
    });

    // --- init: default SBI, light mode ---
    setBank('sbi');
    document.body.classList.remove('dark');

    console.log('✨ Bank QR ready — SBI & Federal Bank (custom images)');
  })();
</script>
</body>
</html>
