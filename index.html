<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Bank QR · SBI & Federal</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="data:application/json,{
    &quot;name&quot;: &quot;Bank QR · SBI &amp; Federal&quot;,
    &quot;short_name&quot;: &quot;BankQR&quot;,
    &quot;description&quot;: &quot;Scan SBI &amp; Federal Bank QR codes&quot;,
    &quot;start_url&quot;: &quot;.&quot;,
    &quot;display&quot;: &quot;standalone&quot;,
    &quot;background_color&quot;: &quot;#f2f4f8&quot;,
    &quot;theme_color&quot;: &quot;#1a4c7a&quot;,
    &quot;orientation&quot;: &quot;portrait&quot;,
    &quot;icons&quot;: [
      {
        &quot;src&quot;: &quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%231a4c7a'/%3E%3Ctext x='256' y='340' text-anchor='middle' font-size='280' fill='white' font-family='sans-serif'%3E%3C%2Ftext%3E%3Ccircle cx='256' cy='220' r='120' fill='white' opacity='0.95'/%3E%3Cpath d='M256 130 L330 260 L182 260 Z' fill='%231a4c7a'/%3E%3Cpath d='M256 310 L330 180 L182 180 Z' fill='%23f59e0b'/%3E%3C/svg%3E&quot;,
        &quot;sizes&quot;: &quot;512x512&quot;,
        &quot;type&quot;: &quot;image/svg+xml&quot;,
        &quot;purpose&quot;: &quot;any maskable&quot;
      },
      {
        &quot;src&quot;: &quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%231a4c7a'/%3E%3Ctext x='256' y='340' text-anchor='middle' font-size='280' fill='white' font-family='sans-serif'%3E%3C%2Ftext%3E%3Ccircle cx='256' cy='220' r='120' fill='white' opacity='0.95'/%3E%3Cpath d='M256 130 L330 260 L182 260 Z' fill='%231a4c7a'/%3E%3Cpath d='M256 310 L330 180 L182 180 Z' fill='%23f59e0b'/%3E%3C/svg%3E&quot;,
        &quot;sizes&quot;: &quot;512x512&quot;,
        &quot;type&quot;: &quot;image/svg+xml&quot;,
        &quot;purpose&quot;: &quot;any maskable&quot;
      }
    ]
  }">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    /* ----- RESET & FULL SCREEN ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      transition: background-color 0.3s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #f2f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ----- LIGHT MODE (default) ----- */
    :root {
      --bg-body: #f2f4f8;
      --bg-card: #ffffff;
      --bg-option: #f0f3f7;
      --bg-option-hover: #e2e8f0;
      --bg-option-active: #d1d9e6;
      --text-primary: #1e293b;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --border-light: #e9edf2;
      --shadow-card: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
      --shadow-btn: 0 4px 8px rgba(0, 0, 0, 0.03);
      --qr-border: #dce1e8;
      --bank-sbi: #2a6f97;
      --bank-federal: #1a4c7a;
      --toggle-bg: #d1d9e6;
      --toggle-circle: #ffffff;
      --icon-color: #1e293b;
    }

    /* ----- DARK MODE ----- */
    body.dark {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --bg-option: #2d3a4f;
      --bg-option-hover: #3b4a63;
      --bg-option-active: #4b5d7a;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border-light: #334155;
      --shadow-card: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
      --shadow-btn: 0 4px 8px rgba(0, 0, 0, 0.3);
      --qr-border: #475569;
      --bank-sbi: #6ba3c7;
      --bank-federal: #5b8db8;
      --toggle-bg: #475569;
      --toggle-circle: #e2e8f0;
      --icon-color: #f1f5f9;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--bg-card);
      border-radius: 2.5rem;
      padding: 2rem 1.8rem 2.5rem;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
      backdrop-filter: blur(2px);
      transition: all 0.3s ease;
      margin: 0 auto;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(145deg, var(--bank-sbi), var(--bank-federal));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .header h1 i {
      font-size: 1.6rem;
      color: var(--bank-sbi);
      background: transparent;
      -webkit-background-clip: unset;
      background-clip: unset;
    }

    .toggle-wrapper {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .toggle-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .toggle-switch {
      width: 50px;
      height: 26px;
      background: var(--toggle-bg);
      border-radius: 40px;
      cursor: pointer;
      position: relative;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
      transition: background 0.25s;
      flex-shrink: 0;
    }

    .toggle-switch .circle {
      width: 22px;
      height: 22px;
      background: var(--toggle-circle);
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.25s ease, background 0.2s;
    }

    body.dark .toggle-switch .circle {
      transform: translateX(24px);
    }

    .toggle-switch i {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      color: #2d3a4f;
      opacity: 0.6;
      pointer-events: none;
    }

    .toggle-switch .fa-moon { left: 6px; }
    .toggle-switch .fa-sun { right: 6px; }
    body.dark .toggle-switch .fa-moon { opacity: 0.2; }
    body.dark .toggle-switch .fa-sun { opacity: 1; color: #fbbf24; }

    /* option buttons */
    .option-group {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .option-btn {
      flex: 1;
      min-width: 120px;
      padding: 0.9rem 0.6rem;
      border-radius: 2rem;
      border: 2px solid transparent;
      background: var(--bg-option);
      color: var(--text-secondary);
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .option-btn i {
      font-size: 1.2rem;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .option-btn:hover {
      background: var(--bg-option-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px -6px rgba(0, 0, 0, 0.08);
    }

    .option-btn:active {
      transform: scale(0.96);
    }

    .option-btn.active {
      background: var(--bg-option-active);
      border-color: var(--bank-sbi);
      color: var(--text-primary);
      box-shadow: 0 6px 14px -6px rgba(42, 111, 151, 0.2);
    }

    .option-btn.active i {
      color: var(--bank-sbi);
    }

    .option-btn.federal-active.active {
      border-color: var(--bank-federal);
    }
    .option-btn.federal-active.active i {
      color: var(--bank-federal);
    }

    /* QR display */
    .qr-display {
      background: var(--bg-body);
      border-radius: 2.2rem;
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid var(--border-light);
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.02);
    }

    .qr-image-wrapper {
      background: white;
      padding: 1.2rem;
      border-radius: 2rem;
      box-shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--qr-border);
      line-height: 0;
      transition: border 0.2s;
      width: fit-content;
      max-width: 100%;
    }

    #qrImage {
      width: 220px;
      height: 220px;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
      background: white;
      border-radius: 12px;
      transition: all 0.2s;
      max-width: 100%;
    }

    .bank-label {
      margin-top: 1.5rem;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .bank-label i {
      font-size: 1.5rem;
    }
    .bank-label .sbi-text { color: var(--bank-sbi); }
    .bank-label .federal-text { color: var(--bank-federal); }

    .qr-hint {
      margin-top: 0.6rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      background: var(--bg-option);
      padding: 0.25rem 1.2rem;
      border-radius: 30px;
    }

    /* PWA install banner (optional) */
    .install-banner {
      margin-top: 1.2rem;
      padding: 0.7rem 1.2rem;
      background: var(--bg-option);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
      cursor: default;
    }
    .install-banner i {
      color: var(--bank-federal);
      font-size: 1.1rem;
    }

    /* responsive */
    @media (max-width: 600px) {
      .container { padding: 1.6rem 1.2rem; border-radius: 2rem; }
      .header h1 { font-size: 1.5rem; }
      .option-btn { font-size: 0.95rem; padding: 0.7rem 0.4rem; min-width: 90px; }
      #qrImage { width: 180px; height: 180px; }
    }

    @media (max-width: 420px) {
      .container { padding: 1rem 0.8rem; }
      .header h1 { font-size: 1.2rem; }
      .option-btn { font-size: 0.8rem; padding: 0.6rem 0.3rem; min-width: 70px; gap: 0.3rem; }
      #qrImage { width: 140px; height: 140px; }
      .qr-image-wrapper { padding: 0.8rem; }
      .qr-display { padding: 1rem; }
      .bank-label { font-size: 1.1rem; }
      .install-banner { font-size: 0.75rem; padding: 0.5rem 0.8rem; }
    }

    @media (max-width: 360px) {
      #qrImage { width: 110px; height: 110px; }
      .option-btn { font-size: 0.7rem; padding: 0.4rem 0.2rem; min-width: 60px; }
    }
  </style>
</head>
<body>

<div class="container" id="appContainer">
  <!-- header -->
  <div class="header">
    <h1><i class="fas fa-qrcode"></i> PayQR</h1>
    <div class="toggle-wrapper">
      <span class="toggle-label"><i class="fas fa-circle-half-stroke"></i></span>
      <div class="toggle-switch" id="themeToggle" role="button" tabindex="0" aria-label="Toggle dark/light mode">
        <span class="circle"></span>
        <i class="fas fa-moon"></i>
        <i class="fas fa-sun"></i>
      </div>
    </div>
  </div>

  <!-- options -->
  <div class="option-group">
    <button class="option-btn sbi-active active" id="sbiBtn" data-bank="sbi">
      <i class="fas fa-building-columns"></i> SBI
    </button>
    <button class="option-btn federal-active" id="federalBtn" data-bank="federal">
      <i class="fas fa-landmark"></i> Federal
    </button>
  </div>

  <!-- QR display -->
  <div class="qr-display">
    <div class="qr-image-wrapper">
      <img id="qrImage" src="https://pub-a99082f3b6674c94a58faa3697bc0276.r2.dev/SBI.jpeg" alt="QR Code">
    </div>
    <div class="bank-label">
      <i class="fas fa-building-columns" id="bankIcon"></i>
      <span id="bankName">State Bank of India</span>
    </div>
    <div class="qr-hint">
      <i class="fas fa-camera"></i> Scan to pay with any UPI app
    </div>
  </div>

  <!-- install hint (PWA) -->
  <div class="install-banner">
    <i class="fas fa-mobile-screen-button"></i>
    <span>Add to Home Screen for quick access</span>
  </div>
</div>

<script>
  (function() {
    // DOM refs
    const themeToggle = document.getElementById('themeToggle');
    const qrImage = document.getElementById('qrImage');
    const bankName = document.getElementById('bankName');
    const bankIcon = document.getElementById('bankIcon');

    const sbiBtn = document.getElementById('sbiBtn');
    const federalBtn = document.getElementById('federalBtn');

    // --- QR DATA with your image URLs ---
    const QR_DATA = {
      sbi: {
        url: 'https://pub-a99082f3b6674c94a58faa3697bc0276.r2.dev/SBI.jpeg',
        label: 'State Bank of India',
        icon: 'fa-building-columns',
        iconColor: 'sbi-text'
      },
      federal: {
        url: 'https://pub-a99082f3b6674c94a58faa3697bc0276.r2.dev/Federl.jpeg',
        label: 'Federal Bank',
        icon: 'fa-landmark',
        iconColor: 'federal-text'
      }
    };

    let currentBank = 'sbi';

    function setBank(bankKey) {
      const data = QR_DATA[bankKey];
      if (!data) return;

      qrImage.src = data.url;
      bankName.textContent = data.label;
      bankIcon.className = `fas ${data.icon}`;
      bankName.className = '';
      if (bankKey === 'sbi') {
        bankName.classList.add('sbi-text');
      } else {
        bankName.classList.add('federal-text');
      }

      sbiBtn.classList.toggle('active', bankKey === 'sbi');
      federalBtn.classList.toggle('active', bankKey === 'federal');
      currentBank = bankKey;
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
    }

    // --- events ---
    sbiBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (currentBank === 'sbi') return;
      setBank('sbi');
    });

    federalBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (currentBank === 'federal') return;
      setBank('federal');
    });

    themeToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleTheme();
    });

    themeToggle.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleTheme();
      }
    });

    // --- init ---
    setBank('sbi');
    document.body.classList.remove('dark');

    // --- PWA: register service worker (inline) ---
    if ('serviceWorker' in navigator) {
      // Inline SW: we create a simple fetch handler to cache assets
      // but since we're in a single HTML, we just register a dummy SW that works offline
      // (We'll use a blob URL for the service worker)
      const swCode = `
        self.addEventListener('install', e => {
          e.waitUntil(
            caches.open('bankqr-v1').then(cache => {
              return cache.addAll([
                '/',
                'index.html'
              ]);
            })
          );
        });
        self.addEventListener('fetch', e => {
          e.respondWith(
            caches.match(e.request).then(r => r || fetch(e.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      
      navigator.serviceWorker.register(swUrl, { scope: '/' })
        .then(() => console.log('📲 Service Worker registered (PWA ready)'))
        .catch(err => console.log('SW registration skipped:', err));
    }

    console.log('✨ Bank QR PWA — SBI & Federal Bank');
  })();
</script>
</body>
</html>
